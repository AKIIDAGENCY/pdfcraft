appId: dz.gov.pole-penal-specialise.investigation-chamber
productName: نظام إدارة غرفة التحقيق
copyright: القطب الجزائي الوطني لمكافحة الإرهاب و الجريمة المنظمة عبر الوطنية
# No auto-update feature in this app, so skip generating update-manifest metadata.
publish: null

# electron-builder's own native-module rebuild step does not reliably cross-compile
# for win32 from a Linux host (it silently rebuilds for the host platform instead —
# confirmed by inspecting the packaged binary). Native deps are rebuilt explicitly
# for the target platform beforehand (see package.json's dist:win script), so skip
# electron-builder's redundant rebuild here to avoid it clobbering the correct one.
npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json
  # Dev-only: seeds the DB with a 60-defendant mock case for demos/testing.
  # Not referenced by main.js, but there is no reason to ship it in a
  # production install — exclude it rather than leave a working path that
  # could overwrite real case data if ever invoked by mistake.
  - '!dist-electron/electron/seedRunner.js'
  - '!dist-electron/electron/db/seed.js'

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: 'InvestigationChamber-Setup-${version}.${ext}'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  language: '1025' # Arabic

asarUnpack:
  - '**/*.node'
